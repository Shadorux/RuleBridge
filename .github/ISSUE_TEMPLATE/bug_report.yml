name: Bug report
description: Report behavior that is incorrect, unsafe, or unexpected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or private rule contents."
  - type: input
    id: version
    attributes:
      label: RuleBridge version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized file tree and rule snippets where useful.
